<div class="tarjeta-comparacion">
  <h3>forkJoin([...3 peticiones])</h3>
  <button (click)="cargar()">Cargar los 3 iniciales</button>
  <div class="comparacion">
    @for (pokemon of iniciales(); track pokemon.name) {
      <div>
        <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name" />
        <p>{{ pokemon.name }}</p>
      </div>
    }
  </div>
</div>
